version: '3.8'
services:
  web:
    image: trafex/php-nginx:latest
    container_name: web
    ports:
            - "1000:8080"
    volumes:
            - ./website:/var/www/html
    restart: always
  website_db:
    image: mariadb:10.11
    container_name: website_db
    environment:
      MARIADB_ROOT_PASSWORD: "123"
      MARIADB_DATABASE: "websitedb"
    volumes:
            - ./srv/webdb:/var/lib/mysql
    restart: always
